{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1730">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sign in — QuickRefill</title>
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/quickrefill.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261113-4">
</head>
<body class="login-page">
  <main class="login-layout">
    <header class="login-topbar">
      <a href="/" class="brand-lockup" style="margin:0;">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3c1.4 2 1.8 3.6.7 5.2 1.4-.4 2.5-1.5 2.9-3 1.8 2 2.2 4.5.8 6.5-.9 1.3-2.5 2.1-4.4 2.1s-3.5-.8-4.4-2.1c-1.4-2-.9-4.5.8-6.5.4 1.5 1.5 2.6 2.9 3C10.2 6.6 10.6 5 12 3z"/>
            <rect x="7" y="14" width="10" height="7" rx="2"/>
            <path d="M9 17.5h6"/>
          </svg>
        </div>
        <strong>QuickRefill</strong>
      </a>
      <a href="/" class="login-back-link">Back to home</a>
    </header>

    <section class="login-sheet" aria-label="Sign in">
      <h2 class="login-card-title">Welcome to QuickRefill</h2>
      <p class="login-card-subtitle">Select your account role to continue.</p>

      <div class="role-picker" role="group" aria-label="Choose account type">
        <button type="button" data-role="customer">Customer</button>
        <button type="button" data-role="rider">Rider</button>
        <button type="button" data-role="vendor">Vendor</button>
      </div>
      <div class="auth-mode-picker" role="tablist" aria-label="Sign-in options">
        <button type="button" role="tab" aria-selected="true" data-mode="login">Sign in</button>
        <button type="button" role="tab" aria-selected="false" data-mode="register">Create account</button>
      </div>
      <form id="login-form">
        <label class="auth-label" for="login-email">Email address</label>
        <input id="login-email" class="auth-name-input" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="name@example.com" required>
        <label class="auth-label" for="login-password">Password</label>
        <div class="password-field"><input id="login-password" class="auth-name-input" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"></button></div>
        <div id="login-error" class="auth-error" role="alert" aria-live="polite"></div>
        <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
      </form>
      <form id="register-form" class="hidden">
        <div class="auth-name-grid">
          <div>
            <label class="auth-label" for="register-first-name">First name</label>
            <input id="register-first-name" class="auth-name-input" type="text" autocomplete="given-name" maxlength="150" required>
          </div>
          <div>
            <label class="auth-label" for="register-last-name">Last name</label>
            <input id="register-last-name" class="auth-name-input" type="text" autocomplete="family-name" maxlength="150">
          </div>
        </div>
        <label class="auth-label" for="register-phone">Phone number</label>
        <input id="register-phone" class="auth-name-input" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="e.g. 0784113900" required>
        <label class="auth-label" for="register-email">Email address</label>
        <input id="register-email" class="auth-name-input" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="name@example.com" required>
        <label class="auth-label" for="register-password">Create password</label>
        <div class="password-field"><input id="register-password" class="auth-name-input" type="password" autocomplete="new-password" required><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"></button></div>
        <label class="auth-label" for="register-password-confirm">Confirm password</label>
        <div class="password-field"><input id="register-password-confirm" class="auth-name-input" type="password" autocomplete="new-password" required><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"></button></div>
        <div id="register-error" class="auth-error" role="alert" aria-live="polite"></div>
        <button class="btn btn-primary auth-submit" type="submit">Create customer account</button>
      </form>
      <div class="auth-support hidden" id="register-support">Rider and vendor accounts are created by QuickRefill support.</div>
    </section>
  </main>
  <script src="{% static 'js/api.js' %}?v=20261113-4"></script>
  <script src="{% static 'js/auth.js' %}?v=20261113-4"></script>
</body>
</html>
